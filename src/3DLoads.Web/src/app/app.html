<main class="layout">
  <app-left-panel
    class="control-panel"
    [scenario]="draftScenario"
    [solution]="solution"
    [busy]="busy"
    [statusMessage]="statusMessage"
    [errorMessage]="errorMessage"
    (addPackage)="addPackage()"
    (removePackage)="removePackage($event)"
    (resetDemo)="resetDemo()"
    (loadDemo)="loadDemo()"
    (runSolve)="runSolve()"
  >
  </app-left-panel>

  <section class="viewer-panel">
    <app-van-viewer [scenario]="viewerScenario" [solution]="solution"></app-van-viewer>
  </section>
</main>
